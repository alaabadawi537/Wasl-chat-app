
name: Wasl Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: |
          unzip -q wasl_chat_mvp_source.zip -d /tmp/wasl
          echo "PROJECT_DIR=/tmp/wasl/wasl_chat_mvp" >> "$GITHUB_ENV"

      - name: Generate Android files
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android --project-name wasl_chat_mvp .

      - name: Get dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wasl-android-test
          path: /tmp/wasl/wasl_chat_mvp/build/app/outputs/flutter-apk/app-debug.apk
